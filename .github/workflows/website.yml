name: Website

# Builds the DragonDaw website and deploys it to https://dragondaw.com (GitHub Pages).
# - pull requests: install, audit, build (no deploy)
# - push to main:  build, deploy, check that dragondaw.com serves the new version
# - every 6 hours: refresh the download counter and redeploy
# - manual:        "Run workflow" button in the Actions tab

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Security: no permissions by default; each job gets only what it needs (see below).
# Actions are pinned to commit SHAs (a tag can be moved by its owner); Dependabot updates them.
permissions: {}

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DOMAIN: dragondaw.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave a token in .git/config for npm packages to find

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        # --ignore-scripts: dependencies can't run install scripts on the runner
        run: npm ci --ignore-scripts

      # Fails only on vulnerabilities in what ships to visitors (React).
      # Build-tool advisories (dev dependencies) are reported but don't block.
      - name: Security audit (shipped code)
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (build tools, report only)
        run: npm audit --audit-level=high || echo "::warning::Advisories in build tools, see log above"

      - name: Get all-time download ledger
        run: |
          if git fetch --depth=1 origin stats 2>/dev/null; then
            git show origin/stats:downloads-ledger.json > "$RUNNER_TEMP/downloads-ledger.json"
            echo "LEDGER_FILE=$RUNNER_TEMP/downloads-ledger.json" >> "$GITHUB_ENV"
          else
            echo "::notice::No stats branch yet; the Download stats workflow creates it."
          fi

      - name: Update download counter
        env:
          DOWNLOAD_REPO: zenoxart/DragonDAW-RS
          GITHUB_TOKEN: ${{ github.token }} # read-only here; DragonDAW-RS is public
        run: node scripts/fetch-downloads.mjs

      - name: Build
        run: npm run build

      # Stamp the build so the post-deploy check can tell the new version is live.
      - name: Version stamp
        run: echo "${{ github.sha }}" > dist/version.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # only the deploy job may publish to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://${{ env.SITE_DOMAIN }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Waits for https://dragondaw.com to serve this commit (up to ~5 minutes).
      - name: Check dragondaw.com is live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsSL --max-time 10 "https://$SITE_DOMAIN/version.txt?nocache=$RANDOM" 2>/dev/null | tr -d '[:space:]')
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "✅ https://$SITE_DOMAIN is serving ${{ github.sha }}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::https://$SITE_DOMAIN is not serving the new version yet. Check the DNS records and Settings → Pages (see README)."
